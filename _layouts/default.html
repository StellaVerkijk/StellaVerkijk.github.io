<!DOCTYPE html>
<!--[if IE 8 ]><html class="no-js oldie ie8" lang="en"> <![endif]-->
<!--[if IE 9 ]><html class="no-js oldie ie9" lang="en"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!--><html class="no-js" lang="en"> <!--<![endif]-->
<head>

   <!--- basic page needs
   ================================================== -->
   <meta charset="utf-8">
   {% seo %}
   <meta name="author" content="{{ site.name }}">

   <!-- mobile specific metas
   ================================================== -->
   <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

   <!-- CSS
   ================================================== -->
   <link rel="stylesheet" href="{{ 'css/theme.css' | relative_url }}">
   <link rel="stylesheet" href="{{ 'css/base.css' | relative_url }}">
   <link rel="stylesheet" href="{{ 'css/main.css' | relative_url }}">
   <link rel="stylesheet" href="{{ 'css/vendor.css' | relative_url }}">

   <!-- script
   ================================================== -->
   <script src="{{ 'js/modernizr.js' | relative_url }}"></script>
   <script src="{{ 'js/pace.min.js' | relative_url }}"></script>

   <!-- favicons
   ================================================== -->
   <link rel="icon" type="image/svg+xml" href="{{ 'favicon.svg' | relative_url }}">
   <link rel="icon" type="image/png" href="{{ 'favicon.png' | relative_url }}">
   <link rel="apple-touch-icon" href="{{ 'favicon.png' | relative_url }}">

</head>

<body id="top">

   {% include header.html %}

   {{ content }}

   {% include footer.html %}

   <div id="preloader">
      <div id="loader"></div>
   </div>

   <!-- Java Script
   ================================================== -->
   <script src="{{ 'js/jquery-2.1.3.min.js' | relative_url }}"></script>
   <script src="{{ 'js/plugins.js' | relative_url }}"></script>
   <script src="{{ 'js/main.js' | relative_url }}"></script>

</body>
</html>
